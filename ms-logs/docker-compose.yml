version: '3.8'

services:
  nats:
    image: nats:latest
    container_name: ms-logs-nats
    restart: always
    command: ["-js"]
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS monitoring dashboard

  db:
    image: postgres:15
    container_name: ms-logs-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_logs_db
    ports:
      - "5433:5432" # Map container 5432 to host 5433
    volumes:
      - ms_logs_db_data:/var/lib/postgresql/data

volumes:
  ms_logs_db_data:
